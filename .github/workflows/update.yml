name: Update NFL Model & Odds

on:
  workflow_dispatch: # Enables the manual "Run workflow" button
  schedule:
    - cron: '0 10 * * 2' # Runs automatically every Tuesday at 10:00 UTC
  push:
    paths:
      - 'update_model.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nfl_data_py pandas numpy scikit-learn

      - name: Run Update Script
        run: python update_model.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add weekly_predictions.csv team_rankings.csv || true
          git commit -m "Automated update: NFL weekly odds, live SOS, and team metrics" || echo "No changes to commit"
          git push
